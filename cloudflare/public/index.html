<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Readori 书源验证控制台</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { max-width: 900px; margin: 0 auto; padding: 28px 18px 64px; background: Canvas; color: CanvasText; }
    h1 { margin: 0 0 8px; font-size: 26px; } p { color: color-mix(in srgb, CanvasText 70%, transparent); }
    section { border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 16px; padding: 18px; margin: 16px 0; }
    label { display:block; margin: 10px 0 6px; font-weight: 600; }
    input,select,button { font: inherit; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 24%, transparent); padding: 9px 12px; }
    select { background: Canvas; color: CanvasText; }
    input[type=text],input[type=password],input[type=file] { width: min(100%, 620px); box-sizing: border-box; background: Canvas; color: CanvasText; }
    button { cursor:pointer; background: Canvas; color: CanvasText; margin: 8px 6px 0 0; } button.primary { background:#2e78a5; color:white; border-color:#2e78a5; }
    button:disabled { opacity:.5; cursor:default; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 10px; }
    .metric { padding: 12px; border-radius: 12px; background: color-mix(in srgb, CanvasText 7%, Canvas); }
    progress { width:100%; height: 16px; } pre { white-space: pre-wrap; max-height: 260px; overflow:auto; font-size:12px; }
    .ok { color:#16834b; } .error { color:#c52b35; }
  </style>
</head>
<body>
  <h1>Readori 书源验证控制台</h1>
  <p>Cloudflare 提供控制台页面，实际验证、任务状态和结果全部由 AMD Micro 服务器完成。提交、取消、查看和下载任务都需要访问令牌（由管理员发放）。</p>
  <section>
    <label for="accessToken">访问令牌</label>
    <input id="accessToken" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴管理员提供的访问令牌">
    <div>
      <button id="saveToken">保存令牌</button>
      <button id="clearToken">清除令牌</button>
    </div>
    <p id="tokenState"></p>
  </section>
  <section>
    <label for="sourceFile">书源 JSON</label>
    <input id="sourceFile" type="file" accept="application/json,.json">
    <label for="appVersion">App 版本</label>
    <select id="appVersion">
      <option value="1.1.1" selected>1.1.1（当前公开版，默认）</option>
      <option value="1.1.2">1.1.2（下一版）</option>
    </select>
    <p>按所选 App 版本判定书源能否使用；想对比两版请分别提交两个任务。</p>
    <div><button id="start" class="primary">开始验证</button></div>
    <p id="message"></p>
  </section>
  <section id="jobSection" hidden>
    <div class="grid">
      <div class="metric"><strong>任务</strong><br><code id="jobId">-</code></div>
      <div class="metric"><strong>状态</strong><br><span id="status">-</span></div>
      <div class="metric"><strong>阶段</strong><br><span id="stage">-</span></div>
      <div class="metric"><strong>通过</strong><br><span id="passed">0</span> / <span id="total">0</span></div>
    </div>
    <p><progress id="progress" value="0" max="1"></progress></p>
    <button id="cancel">取消任务</button>
    <button id="resume">恢复任务</button>
    <button id="download" hidden>下载通过书源</button>
    <pre id="events"></pre>
  </section>
  <script>
    const $ = (id) => document.getElementById(id);
    let currentJob = ""; let timer = 0; let lastEvent = 0;
    // Access token: kept in this browser only (localStorage) and sent as a Bearer header on every API call.
    const TOKEN_KEY = "readori-validator-access-token";
    let accessToken = "";
    try { accessToken = localStorage.getItem(TOKEN_KEY) || ""; } catch (_) {}
    const UNAUTHORIZED = "访问令牌无效或缺失，请在上方填写并保存正确的访问令牌";
    function showTokenState() {
      $("accessToken").value = accessToken;
      $("tokenState").textContent = accessToken ? "已保存访问令牌（仅保存在本浏览器）" : "尚未填写访问令牌";
    }
    function saveToken() {
      accessToken = $("accessToken").value.trim();
      try { accessToken ? localStorage.setItem(TOKEN_KEY, accessToken) : localStorage.removeItem(TOKEN_KEY); } catch (_) {}
      showTokenState(); message(accessToken ? "访问令牌已保存" : "访问令牌已清除");
      if (accessToken && currentJob) poll();
    }
    function clearToken() {
      accessToken = ""; $("accessToken").value = "";
      try { localStorage.removeItem(TOKEN_KEY); } catch (_) {}
      clearTimeout(timer); showTokenState(); message("访问令牌已清除");
    }
    const headers = () => ({ "content-type":"application/json", ...(accessToken ? { authorization:`Bearer ${accessToken}` } : {}) });
    class AuthError extends Error {}
    async function failure(response) {
      if (response.status === 401) return new AuthError(UNAUTHORIZED);
      let body = null;
      try { body = response.headers.get("content-type")?.includes("json") ? await response.json() : null; } catch (_) {}
      return new Error(body?.error || body?.detail || `HTTP ${response.status}`);
    }
    function message(text, error=false) { $("message").textContent=text; $("message").className=error?"error":"ok"; }
    async function request(path, options={}) {
      if (!accessToken) throw new AuthError(UNAUTHORIZED);
      const response = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers||{}) } });
      if (!response.ok) throw await failure(response);
      return response.headers.get("content-type")?.includes("json") ? await response.json() : await response.text();
    }
    async function startJob() {
      const file=$("sourceFile").files[0]; if(!file) return message("请选择 JSON 文件",true);
      $("start").disabled=true; message("正在上传并创建任务…");
      try {
        const payload=JSON.parse(await file.text());
        const base=Array.isArray(payload)?{sources:payload,inputName:file.name}:{...payload,inputName:payload.inputName||file.name};
        const body={...base,config:{...(base.config||{}),app_version:$("appVersion").value}};
        const created=await request("/api/jobs",{method:"POST",body:JSON.stringify(body)});
        currentJob=created.job.id; lastEvent=0; $("jobSection").hidden=false; $("jobId").textContent=currentJob; message("任务已排队"); poll();
      } catch(error) { message(error.message,true); }
      finally { $("start").disabled=false; }
    }
    async function poll() {
      if(!currentJob) return;
      try {
        const job=await request(`/api/jobs/${encodeURIComponent(currentJob)}`);
        $("status").textContent=job.status; $("stage").textContent=job.stage; $("progress").value=job.progress||0; $("passed").textContent=job.passedCount||0; $("total").textContent=job.totalSources||0;
        const events=await request(`/api/jobs/${encodeURIComponent(currentJob)}/events?afterId=${lastEvent}`);
        for(const event of events.items||[]) { lastEvent=Math.max(lastEvent,event.id); $("events").textContent+=`[${event.stage}] ${event.message}\n`; }
        $("download").hidden=job.status!=="completed";
        if(["completed","failed","cancelled"].includes(job.status)) { message(job.status==="completed"?"验证完成":`任务${job.status}`,job.status!=="completed"); return; }
        clearTimeout(timer); timer=setTimeout(poll,2000);
      } catch(error) {
        message(error.message,true); clearTimeout(timer);
        if(!(error instanceof AuthError)) timer=setTimeout(poll,5000); // a rejected token will not fix itself; wait for a new one
      }
    }
    $("saveToken").addEventListener("click",saveToken);
    $("clearToken").addEventListener("click",clearToken);
    showTokenState();
    $("start").addEventListener("click",startJob);
    $("cancel").addEventListener("click",async()=>{try{await request(`/api/jobs/${currentJob}/cancel`,{method:"POST",body:"{}"});poll();}catch(e){message(e.message,true);}});
    $("resume").addEventListener("click",async()=>{try{await request(`/api/jobs/${currentJob}/resume`,{method:"POST",body:"{}"});poll();}catch(e){message(e.message,true);}});
    $("download").addEventListener("click",async()=>{try{if(!accessToken)throw new AuthError(UNAUTHORIZED);const response=await fetch(`/api/jobs/${encodeURIComponent(currentJob)}/result`,{headers:headers()});if(!response.ok)throw await failure(response);const blob=await response.blob();const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`validated-${currentJob}.json`;a.click();URL.revokeObjectURL(a.href);}catch(e){message(e.message,true);}});
  </script>
</body>
</html>
