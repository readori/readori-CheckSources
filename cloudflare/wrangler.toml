name = "readori-source-validator-control"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

[[routes]]
pattern = "syyz.readori.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# The Worker is a thin public proxy. All task state, input files, validation,
# progress and results live on the AMD Micro server; no D1/R2 binding is used.
VALIDATOR_SERVER_URL = "https://syyz-api.readori.com"
PUBLIC_CONTROL_PLANE = "true"
FRONTEND_ORIGIN = "https://syyz.readori.com"

# Secrets (never put these in [vars]; set them with `wrangler secret put`):
#   VALIDATOR_SERVER_TOKEN          backend API key the Worker injects (must equal READORI_VALIDATOR_API_KEY on the server)
#   READORI_VALIDATOR_ACCESS_TOKEN  console access token; every /api/* route except /api/healthz requires
#                                   `Authorization: Bearer <token>`. When it is not set the Worker answers 503
#                                   (fail closed) instead of running open.
