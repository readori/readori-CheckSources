name: AA Readori Source Validator Cloudflare

run-name: Source Validator Cloudflare ${{ inputs.mode }} @ ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "部署模式：创建缺少的 Cloudflare 资源并迁移 D1，或仅部署"
        required: true
        default: deploy-and-migrate
        type: choice
        options:
          - deploy-and-migrate
          - deploy
          - dry-run
      source_ref:
        description: "readori-CheckSources 的分支、标签或提交 SHA"
        required: true
        default: main
        type: string
      bootstrap_resources:
        description: "资源不存在时自动创建 D1、R2 bucket 和 Queue"
        required: true
        default: true
        type: boolean
      health_url:
        description: "可选健康检查 URL，例如 https://validator.example.workers.dev/api/healthz"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: readori-source-validator-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull validator source and deploy Cloudflare control plane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Keep deployment credentials in the protected environment. Repository
    # secrets remain supported; environment secrets are also exposed here.
    environment:
      name: production

    env:
      SOURCE_REPOSITORY: readori/readori-CheckSources
      SOURCE_REF: ${{ inputs.source_ref }}
      TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || vars.CLOUDFLARE_D1_DATABASE_ID }}
      CONTROL_API_KEY: ${{ secrets.CONTROL_API_KEY }}
      EXECUTOR_TOKEN: ${{ secrets.EXECUTOR_TOKEN }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN || vars.FRONTEND_ORIGIN }}
      DEPLOY_MODE: ${{ inputs.mode }}
      BOOTSTRAP_RESOURCES: ${{ inputs.bootstrap_resources }}
      HEALTH_URL: ${{ inputs.health_url }}

    steps:
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${TARGET_REPO_PAT:-}" ] || missing+=("TARGET_REPO_PAT")
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${DEPLOY_MODE}" != "dry-run" ]; then
            [ -n "${CONTROL_API_KEY:-}" ] || missing+=("CONTROL_API_KEY")
            [ -n "${EXECUTOR_TOKEN:-}" ] || missing+=("EXECUTOR_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deployment secrets/variables: ${missing[*]}"
            echo "::error::Add the missing values as GitHub Secrets in the production environment (or repository-level Secrets), not Variables."
            echo "::error::CONTROL_API_KEY is used by the public /api/* endpoints; EXECUTOR_TOKEN must exactly match the AMD Micro executor token."
            echo "::error::Use mode=dry-run when checking repository/Cloudflare access without deploying; deploy and deploy-and-migrate require both runtime secrets."
            exit 1
          fi
          echo "::add-mask::$TARGET_REPO_PAT"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "${CONTROL_API_KEY:-}" ] || echo "::add-mask::$CONTROL_API_KEY"
          [ -z "${EXECUTOR_TOKEN:-}" ] || echo "::add-mask::$EXECUTOR_TOKEN"
          echo "Source repository: ${SOURCE_REPOSITORY}"
          echo "Source ref: ${SOURCE_REF}"
          echo "Mode: ${DEPLOY_MODE}"

      - name: Checkout readori-CheckSources without invoking its Actions
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/source-validator"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          git -C "$SOURCE_DIR" init .
          git -C "$SOURCE_DIR" remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$TARGET_REPO_PAT" | base64 | tr -d '\r\n')"
          git -C "$SOURCE_DIR" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --prune --depth=1 origin "$SOURCE_REF"
          git -C "$SOURCE_DIR" checkout --force --detach FETCH_HEAD
          git -C "$SOURCE_DIR" remote set-url origin "https://github.com/${SOURCE_REPOSITORY}.git"
          test -f "$SOURCE_DIR/cloudflare/package.json" || {
            echo "::error::cloudflare/package.json not found in ${SOURCE_REPOSITORY}"
            find "$SOURCE_DIR" -maxdepth 3 -type f | sed -n '1,160p'
            exit 1
          }
          test -f "$SOURCE_DIR/cloudflare/wrangler.toml" || {
            echo "::error::cloudflare/wrangler.toml not found in ${SOURCE_REPOSITORY}"
            exit 1
          }
          test -f "$SOURCE_DIR/cloudflare/src/index.js" || {
            echo "::error::cloudflare/src/index.js not found in ${SOURCE_REPOSITORY}"
            exit 1
          }
          test -d "$SOURCE_DIR/cloudflare/migrations" || {
            echo "::error::cloudflare/migrations is missing in ${SOURCE_REPOSITORY}"
            exit 1
          }
          SOURCE_COMMIT="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "Source commit: $SOURCE_COMMIT"
          echo "✅ Source checkout completed without running private repository workflows"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler dependencies
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler --version

      - name: Resolve source configuration
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python3 - wrangler.toml > "$RUNNER_TEMP/readori-source-validator-config.env" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          path = Path(sys.argv[1])
          data = tomllib.loads(path.read_text(encoding="utf-8"))
          worker_name = str(data.get("name", "")).strip()
          d1 = (data.get("d1_databases") or [{}])[0]
          r2 = data.get("r2_buckets") or []
          queue = (data.get("queues", {}).get("producers") or [{}])[0]
          input_r2 = next((item for item in r2 if str(item.get("binding", "")).upper() == "INPUTS"), None)
          result_r2 = next((item for item in r2 if str(item.get("binding", "")).upper() == "RESULTS"), None)
          input_r2 = input_r2 or (r2[0] if r2 else {})
          result_r2 = result_r2 or (r2[1] if len(r2) > 1 else input_r2)
          values = {
              "WORKER_NAME": worker_name,
              "D1_DATABASE_NAME": str(d1.get("database_name", "")).strip(),
              "D1_DATABASE_ID_FROM_SOURCE": str(d1.get("database_id", "")).strip(),
              "INPUT_BUCKET_NAME": str(input_r2.get("bucket_name", "")).strip(),
              "RESULT_BUCKET_NAME": str(result_r2.get("bucket_name", "")).strip(),
              "QUEUE_NAME": str(queue.get("queue", "")).strip(),
          }
          required = ("WORKER_NAME", "D1_DATABASE_NAME", "INPUT_BUCKET_NAME", "RESULT_BUCKET_NAME", "QUEUE_NAME")
          missing = [name for name in required if not values[name]]
          if missing:
              raise SystemExit("::error::wrangler.toml is missing: " + ", ".join(missing))
          invalid = [
              name for name in required
              if not re.fullmatch(r"[A-Za-z0-9._-]{1,128}", values[name])
          ]
          if invalid:
              raise SystemExit("::error::invalid resource name in wrangler.toml: " + ", ".join(invalid))
          for key, value in values.items():
              print(f"{key}={value}")
          PY
          cat "$RUNNER_TEMP/readori-source-validator-config.env" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              WORKER_NAME|D1_DATABASE_NAME|INPUT_BUCKET_NAME|RESULT_BUCKET_NAME|QUEUE_NAME)
                [[ "$value" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || {
                  echo "::error::Invalid $key from wrangler.toml; only letters, digits, dot, underscore and hyphen are allowed"
                  exit 1
                }
                ;;
            esac
          done < "$RUNNER_TEMP/readori-source-validator-config.env"
          echo "Worker: ${WORKER_NAME:-unknown}"
          echo "D1: ${D1_DATABASE_NAME:-unknown}"
          echo "R2 input: ${INPUT_BUCKET_NAME:-unknown}"
          echo "R2 result: ${RESULT_BUCKET_NAME:-unknown}"
          echo "Queue: ${QUEUE_NAME:-unknown}"

      - name: Resolve and optionally bootstrap Cloudflare resources
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail

          resource_value() {
            local kind="$1"
            local path="$2"
            local wanted="$3"
            python3 - "$kind" "$path" "$wanted" <<'PY'
          import json
          import sys
          
          kind, path, wanted = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          found = ""
          
          def visit(value):
              global found
              if found or not isinstance(value, (dict, list)):
                  return
              if isinstance(value, dict):
                  names = [value.get("name"), value.get("database_name"), value.get("queue_name"), value.get("bucket_name")]
                  if wanted in {str(item).strip() for item in names if item is not None}:
                      if kind == "d1":
                          found = str(value.get("uuid") or value.get("database_id") or value.get("id") or "").strip()
                      elif kind == "queue":
                          found = str(value.get("queue_id") or value.get("id") or "").strip()
                      else:
                          found = str(value.get("name") or value.get("bucket_name") or "").strip()
                      return
                  for child in value.values():
                      visit(child)
              else:
                  for child in value:
                      visit(child)
          visit(payload)
          print(found)
          PY
          }

          if [ -n "${CLOUDFLARE_D1_DATABASE_ID:-}" ]; then
            RESOLVED_D1_DATABASE_ID="$CLOUDFLARE_D1_DATABASE_ID"
          else
            npx wrangler d1 list --json > "$RUNNER_TEMP/readori-d1.json"
            RESOLVED_D1_DATABASE_ID="$(resource_value d1 "$RUNNER_TEMP/readori-d1.json" "$D1_DATABASE_NAME")"
          fi
          if [ -z "$RESOLVED_D1_DATABASE_ID" ] && [ "$DEPLOY_MODE" != "dry-run" ] && [ "$BOOTSTRAP_RESOURCES" = "true" ]; then
            npx wrangler d1 create "$D1_DATABASE_NAME" > "$RUNNER_TEMP/readori-d1-create.txt"
            npx wrangler d1 list --json > "$RUNNER_TEMP/readori-d1.json"
            RESOLVED_D1_DATABASE_ID="$(resource_value d1 "$RUNNER_TEMP/readori-d1.json" "$D1_DATABASE_NAME")"
          fi
          [ -n "$RESOLVED_D1_DATABASE_ID" ] || { echo "::error::D1 database '$D1_DATABASE_NAME' was not found. Set CLOUDFLARE_D1_DATABASE_ID or enable bootstrap_resources."; exit 1; }
          [[ "$RESOLVED_D1_DATABASE_ID" =~ ^[A-Za-z0-9-]{16,80}$ ]] || { echo "::error::resolved D1 database ID has an invalid format"; exit 1; }

          npx wrangler r2 bucket list --json > "$RUNNER_TEMP/readori-r2.json"
          INPUT_BUCKET_EXISTS="$(resource_value r2 "$RUNNER_TEMP/readori-r2.json" "$INPUT_BUCKET_NAME")"
          RESULT_BUCKET_EXISTS="$(resource_value r2 "$RUNNER_TEMP/readori-r2.json" "$RESULT_BUCKET_NAME")"
          if [ "$DEPLOY_MODE" != "dry-run" ] && [ "$BOOTSTRAP_RESOURCES" = "true" ]; then
            [ -n "$INPUT_BUCKET_EXISTS" ] || npx wrangler r2 bucket create "$INPUT_BUCKET_NAME"
            [ -n "$RESULT_BUCKET_EXISTS" ] || npx wrangler r2 bucket create "$RESULT_BUCKET_NAME"
            npx wrangler r2 bucket list --json > "$RUNNER_TEMP/readori-r2.json"
            INPUT_BUCKET_EXISTS="$(resource_value r2 "$RUNNER_TEMP/readori-r2.json" "$INPUT_BUCKET_NAME")"
            RESULT_BUCKET_EXISTS="$(resource_value r2 "$RUNNER_TEMP/readori-r2.json" "$RESULT_BUCKET_NAME")"
          fi
          [ -n "$INPUT_BUCKET_EXISTS" ] || { echo "::error::R2 bucket '$INPUT_BUCKET_NAME' was not found."; exit 1; }
          [ -n "$RESULT_BUCKET_EXISTS" ] || { echo "::error::R2 bucket '$RESULT_BUCKET_NAME' was not found."; exit 1; }

          npx wrangler queues list --json > "$RUNNER_TEMP/readori-queues.json"
          QUEUE_ID="$(resource_value queue "$RUNNER_TEMP/readori-queues.json" "$QUEUE_NAME")"
          if [ -z "$QUEUE_ID" ] && [ "$DEPLOY_MODE" != "dry-run" ] && [ "$BOOTSTRAP_RESOURCES" = "true" ]; then
            npx wrangler queues create "$QUEUE_NAME"
            npx wrangler queues list --json > "$RUNNER_TEMP/readori-queues.json"
            QUEUE_ID="$(resource_value queue "$RUNNER_TEMP/readori-queues.json" "$QUEUE_NAME")"
          fi
          [ -n "$QUEUE_ID" ] || { echo "::error::Queue '$QUEUE_NAME' was not found."; exit 1; }

          {
            echo "RESOLVED_D1_DATABASE_ID=$RESOLVED_D1_DATABASE_ID"
            echo "QUEUE_ID=$QUEUE_ID"
          } >> "$GITHUB_ENV"
          echo "Resolved Cloudflare resource identifiers (secret values are not printed)."

      - name: Generate deployment Wrangler configuration
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python3 - wrangler.toml wrangler-ci.toml "$RESOLVED_D1_DATABASE_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          source, target, database_id = sys.argv[1:]
          if not database_id.strip():
              raise SystemExit("::error::resolved D1 database ID is empty")
          text = Path(source).read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^(\s*database_id\s*=\s*)"[^"]*"\s*$',
              lambda match: f'{match.group(1)}"{database_id}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("::error::wrangler.toml must contain exactly one d1 database_id")
          Path(target).write_text(updated, encoding="utf-8")
          PY
          test -s wrangler-ci.toml
          echo "Generated isolated wrangler-ci.toml; source checkout was not modified."

      - name: Run Wrangler dry-run package validation
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler-dry-run
          npx wrangler deploy --dry-run --config wrangler-ci.toml --outdir .wrangler-dry-run
          test -d .wrangler-dry-run
          echo "✅ Wrangler deployment package is valid"

      - name: Apply D1 migrations
        if: ${{ inputs.mode == 'deploy-and-migrate' }}
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler-ci.toml

      - name: Deploy Worker and static control console
        if: ${{ inputs.mode != 'dry-run' }}
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler-ci.toml
          echo "✅ Worker and Pages assets deployed"

      - name: Configure encrypted Worker secrets
        if: ${{ inputs.mode != 'dry-run' }}
        working-directory: ${{ github.workspace }}/source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CONTROL_API_KEY" | npx wrangler secret put CONTROL_API_KEY --config wrangler-ci.toml
          printf '%s' "$EXECUTOR_TOKEN" | npx wrangler secret put EXECUTOR_TOKEN --config wrangler-ci.toml
          if [ -n "${FRONTEND_ORIGIN:-}" ]; then
            printf '%s' "$FRONTEND_ORIGIN" | npx wrangler secret put FRONTEND_ORIGIN --config wrangler-ci.toml
          fi
          echo "✅ Worker secrets updated without printing their values"

      - name: Post-deploy health check
        if: ${{ inputs.mode != 'dry-run' && inputs.health_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$HEALTH_URL"
          echo
          echo "✅ Cloudflare control plane health check passed"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Readori Source Validator Cloudflare deployment'
            echo
            echo "- Source repository: \`${SOURCE_REPOSITORY}\`"
            echo "- Source ref: \`${SOURCE_REF}\`"
            echo "- Source commit: \`${SOURCE_COMMIT:-unresolved}\`"
            echo "- Mode: \`${DEPLOY_MODE}\`"
            echo "- Worker: \`${WORKER_NAME:-unresolved}\`"
            echo "- D1: \`${D1_DATABASE_NAME:-unresolved}\`"
            echo "- R2 input/result: \`${INPUT_BUCKET_NAME:-unresolved}\`, \`${RESULT_BUCKET_NAME:-unresolved}\`"
            echo "- Queue: \`${QUEUE_NAME:-unresolved}\`"
            echo "- Private repository Actions invoked: **No**"
            echo "- Secret values copied to GitHub logs: **No**"
            echo "- AMD Micro executor remains a separate systemd service; this job deploys only the Cloudflare control plane."
          } >> "$GITHUB_STEP_SUMMARY"
